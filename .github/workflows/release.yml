name: Build & Release PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          swift run SKALAMenuBarTests

      - name: Build macOS PKG
        id: build_pkg
        run: |
          chmod +x ./scripts/build_pkg.sh
          chmod +x ./scripts/pkg_scripts/postinstall
          ./scripts/build_pkg.sh
          VERSION=$(grep '^VERSION=' ./scripts/build_pkg.sh | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload PKG as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKALA-MenuBar-pkg
          path: dist/*.pkg
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build_pkg.outputs.version }}
          name: Release v${{ steps.build_pkg.outputs.version }}
          files: dist/*.pkg
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
