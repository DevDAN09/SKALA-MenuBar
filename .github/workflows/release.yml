name: Build & Release PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          swift run SKALAMenuBarTests

      - name: Build macOS PKG & DMG
        id: build_dist
        run: |
          chmod +x ./scripts/build_pkg.sh ./scripts/build_dmg.sh
          chmod +x ./scripts/pkg_scripts/*
          ./scripts/build_pkg.sh
          ./scripts/build_dmg.sh
          VERSION=$(grep '^VERSION=' ./scripts/build_pkg.sh | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SKALA-MenuBar-dist
          path: |
            dist/*.pkg
            dist/*.dmg
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build_dist.outputs.version }}
          name: Release v${{ steps.build_dist.outputs.version }}
          files: |
            dist/*.pkg
            dist/*.dmg
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
